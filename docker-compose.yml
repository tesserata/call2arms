version: '3'
services:
  bot:
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - ./data_storage:/app/call2arms/data_storage
    env_file:
      - .env
    container_name: call2arms
    restart: unless-stopped
    labels:
      tier: service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
